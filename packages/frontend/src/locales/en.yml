dialog.languageTitle: "Language"
dialog.helpTitle: "Help"
dialog.settingsTitle: "Settings"
dialog.helpPlaceholder: ""
dialog.helpText: |
  Play

  Click a piece to inspect its move range, then click a target square to create a pending move. You can make multiple semimoves before submitting them with Submit; Undo and Redo only affect unsubmitted pending moves. Right click deselects. Keyboard controls can be viewed and customized in Settings > Keyboard.

  Record

  The Record panel shows the current record tree. Click a move segment to focus its board; focusing from a board scrolls the Record panel to the matching move and highlights it. Cursors represent exact timepoints between actions, so submitting from a cursor either follows matching future history or creates a new branch.

  Branches

  Purple blocks represent branches or spectator deductions. A branch is another path in the record tree, not an overwrite of later history; submitting a different move from an earlier cursor creates one. Use the delete-following-history icon on a cursor when you intentionally want to trim future actions.

  Study tools

  In Study, actions can have comments, moves can have glyphs, and boards can have square or arrow markers. In online studies, comments, markers, cursors, and member status use participant colors. The Members and Chat panels are used for member presence, following, and conversation.

  Panels and settings

  Record, Minimap, Axis view, Chat, Members, Clock, and other tools can be shown as panels and arranged in the custom layout. Import and Export live in the relevant create/export flows. 5DPGN options, appearance, game behavior, study display, and keyboard bindings can be adjusted in Settings.
