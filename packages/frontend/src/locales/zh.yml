dialog.helpTitle: "帮助"
dialog.settingsTitle: "设置"
dialog.helpPlaceholder: ""
dialog.helpText: |
  对局

  点击棋子查看可走范围，再点击目标格形成 pending move。可以连续走多个小步，确认后用 Submit 提交；Undo/Redo 只作用于尚未提交的小步。右键可以取消选择。键盘操作可以在 Settings > Keyboard 中查看和自定义。

  记谱

  记谱面板显示当前棋谱树。点击 move 片段会聚焦对应棋盘；从棋盘聚焦到记谱时会滚动并高亮对应 move。游标表示 action 之间的精确时间点，提交时会从游标位置开始匹配后续历史或创建新分支。

  分支

  紫色区块表示分支或观战推演。分支是棋谱树中的另一条路线，而不是对后续历史的覆盖；从较早游标提交不同走法会创建分支。删除后续历史需要通过游标上的删除图标确认。

  研讨工具

  Study 中可以给 action 添加评论，给 move 添加 glyph，并在棋盘上添加格子标记或箭头标记。多人在线研讨中，评论、标记、cursor 和成员状态会使用参与者颜色区分；Members 和 Chat 面板用于查看成员、跟随成员和聊天。

  面板与设置

  Record、Minimap、Axis view、Chat、Members、Clock 等都可以作为面板显示，并可调整布局。Import / Export 在对应的创建或导出界面中使用；5DPGN、外观、游戏行为、研讨显示方式和键盘绑定都可以在 Settings 中调整。
