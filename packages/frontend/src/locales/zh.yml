dialog.settingsTitle: "设置"
dialog.helpPlaceholder: ""
dialog.helpText: |
  快捷键

  Z / 退格：撤销小步
  F / 回车：提交回合或结束对局
  右键：取消选择
  WASD：平移视口
  Q / E：缩小 / 放大
  R：显示或隐藏记谱面板
  C：显示或隐藏棋钟
  U：翻转视角
  `：打开设置
  Esc：打开或关闭局内菜单

  记谱和文件

  记谱面板会实时显示 5dpgn。可以在该面板中导入或导出对局。记谱中的位置可以点击，用于聚焦对应棋盘。点击记谱标记可以回溯到对应大步；在回溯状态提交会覆盖之后的历史。
