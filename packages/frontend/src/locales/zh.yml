dialog.helpTitle: "帮助"
dialog.settingsTitle: "设置"
dialog.helpPlaceholder: ""
dialog.helpText: |
  快捷键

  Z / 退格：撤销小步
  F / 回车：提交回合或结束对局
  右键：取消选择
  WASD：平移视口
  Q / E：缩小 / 放大
  R：显示或隐藏记谱面板
  [ / ]：跳转到当前记谱块中的上 / 下一个游标
  Shift + [ / ]：跳转到当前记谱块头 / 块尾
  \：进入或轮换当前记谱游标上的分支
  C：显示或隐藏棋钟
  U：翻转视角
  `：打开设置
  Esc：打开或关闭局内菜单

  记谱

  记谱面板会实时显示 5dpgn。点击 move 片段可以聚焦对应棋盘。游标标签表示 action 之间的精确位置；可以用跳转图标或记谱快捷键在当前块中移动、跳到块头/块尾，或进入和轮换分支。

  从较早的游标提交时，如果和后续 action 匹配，会直接进入那一步；如果不同，则创建紫色分支，而不是删除后续历史。删除后续图标可以从某个游标裁掉之后的历史。Pending moves 会用黄色标记，观战推演和分支会用紫色标记。

  可以在记谱面板中导入或导出 PGN/FEN。导出支持到当前游标为止的线性记谱，也支持完整的树形记谱。
