name: deploy_page

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy_page.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/frontend/**'
      - 'packages/core/**'
      - 'packages/shared/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.x.x

      - name: Build
        run: |
          pnpm install --no-frozen-lockfile
          pnpm -F @5dcol/frontend build

      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: ./packages/frontend/dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
