services:
  5dcol-backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
        BUILD_DATE: ${BUILD_DATE:-}
    restart: unless-stopped
    environment:
      - PORT=5161
    networks:
      - caddy_network

networks:
  caddy_network:
    external: true
